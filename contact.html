      <article id="contact-us" class="c-article o-column">
        <h1>Get In Touch</h1>
        <form class="c-form o-column" method="post">
          <div class="o-row o-row--responsive@tablet">
            <div class="c-input c-input--required u-1/2 u-1/1@tablet"> <label for="name">Your Name</label> <input

          </div>
          <div class="o-row o-row--responsive@tablet">
            <div class="c-input u-1/2 u-1/1@tablet"> <label for="businessName">Business Name</label> <input type="text"
                id="businessName" name="businessName" value="" inputmode="text"> </div>
            <div class="c-input u-1/2 u-1/1@tablet"> <label for="tel">Phone Number</label> <input type="text" id="tel"
                name="tel" value="" inputmode="tel"> </div>
          </div>
          <div class="c-input c-input--required"> <label for="tel">How can we help you?</label> <textarea id="message"
              name="message" value="" required></textarea> </div>
          <div class="g-recaptcha u-align-center" data-sitekey="6LfXhnYpAAAAAAO4KzaR3a7DeGzRsjY-1VURQ4Ih"></div> <button
            type="submit" class="c-button">Send message</button>
        </form>
      </article>
      <script>
        document.querySelectorAll('#contact-us').forEach(function (el) {
          var alert = el.querySelector('.c-alert');
          if (alert) {
            el.scrollIntoView({behavior: 'smooth'});
            if (alert.classList.contains('c-alert--success')) {
              window.history.replaceState({}, document.title, document.location.pathname);
              setTimeout(() => {
                alert.classList.add('c-alert--hidden');
              }, 5000);
            }
          }
        });
      </script>

  <script>
    document.querySelectorAll('.c-lqip__image').forEach(function (el) {
      var img = new Image();
      img.src = el.style.backgroundImage.replace(/^\s*url\s*\(\s*['"](.+?)['"]\s*\)\s*$/, '$1');
      if (img.complete) {
        el.classList.add('is-cached');
      }
      img.onload = img.onerror = function () {
        el.classList.add('is-loaded');
      };
    });
  </script>
